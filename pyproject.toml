[tool.poetry]
name = "flyclopszero"
version = "0.1.0"
description = "Fly Closed-Loop Optogenetic Projection System with ZeroMQ communication"
authors = ["Rishika Mohanta <neurorishika@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "flyclopszero", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.9, <3.11"

# Core Scientific & Compute
numpy = "^1.23.5"  # Use a version compatible with modern CV/ML libraries
scipy = "^1.9.0"
numba = "^0.58.0" # Updated numba for numpy compatibility
pandas = "^2.0.0"
matplotlib = "^3.7.5"
kornia = "^0.7.2"
opencv-python = "^4.9.0"
h5py = "^3.10.0"
hdf5plugin = "^4.2.0"

# Hardware & GUI
pypylon = "^1.8.1" # Using a flexible version for the wrapper
pyside2 = "^5.15.2"
pygame = "^2.5.2"
pycairo = "^1.25.1"
python-kasa = "^0.6.0"
apriltag = "^0.0.16"

# Application & Tooling
tqdm = "^4.65.0"
flask = "^3.0.0"
pyzmq = "^25.1.2"
pyyaml = "^6.0.1"
msgpack = "^1.0.7" 
sortedcontainers = "^2.4.0"
lazy-loader = "^0.3"
joblib = "^1.3.1"
jsonschema = "^4.17.3"
argparse = "^1.4.0"
psutil = "^5.9.0"

# Dev Dependencies (better placed in [tool.poetry.group.dev.dependencies])
jupyter = "^1.0.0"
ipykernel = "^6.29.5"
mkinit = "^1.0.0"
scikit-guess = "^0.0.1a0"

[tool.poetry.group.dev.dependencies]
pip = "^24.1.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
